   if(session&&session.k!==k)throw Error('Selesaikan dulu sesi yang sedang berjalan.');
   session={id:'latihan-'+(++seq),k,phase:'identity'};return {id:session.id,name,npm}
  }
  if(!session||session.id!==d.id)throw Error('Sesi sudah berakhir.');
  if(op==='touch')return true;
  if(op==='ready'&&session.phase==='identity'){session.phase='ready';return candidates}
  if(op==='vote'&&session.phase==='committed')return 'committed';
  if(op==='vote'&&session.phase==='ready'&&!votes.has(session.k)&&candidates.some(c=>c.id===d.candidate)){votes.set(session.k,d.candidate);session.phase='committed';return 'committed'}
  if(op==='release'&&session.phase==='committed'||op==='cancelSelf'&&session.phase!=='committed'){session=null;return true}
  throw Error('Sesi belum sesuai untuk tindakan ini.');
 }
 return {run,reset};
})();
async function rpc(op,data={}){return standalone&&op!=='pair'?practice.run(op,data):dashboardRpc(op,data)}
const btn=(op,text,cl='',attrs='')=>`<button type="button" data-do="${op}" class="${cl}" ${attrs}>${text}</button>`;
const issueText={ambiguous:'Empat digit ini cocok dengan lebih dari satu NPM. Hubungi admin untuk memeriksa identitas Anda.',missing:'Tidak ada NPM dengan empat digit ini. Periksa angkanya atau hubungi admin.',unknown:'Kartu tidak terdaftar. Hubungi admin atau masukkan empat digit terakhir NPM.',failed:'Kartu gagal terbaca. Hubungi admin atau masukkan empat digit terakhir NPM.',voted:'NPM ini sudah memilih. Hubungi admin jika data ini tidak sesuai.'};
let state='scan',snap={},id='',person=null,choices=[],pick=null,note='',digits='',issue='',busy=false,reading=false,polling=false,epoch=0,pending=false,prior='',lastActivity=0,lastTouch=0,deadline=0,publicSig='',offline=false;

const tapArt=`<svg data-do="demo" data-kind="valid" class="instrument" viewBox="0 0 320 212" aria-hidden="true"><defs>

<path d="m71 145 78-28q9-4 19 0l80 26q14 5 0 10l-80 29q-9 3-18 0l-79-27q-12-5 0-10Z" fill="url(#base)" stroke="#e9f9d5" stroke-width="1.5"/><ellipse cx="160" cy="150" rx="25" ry="8" fill="none" stroke="#dbf6cf" stroke-dasharray="4 3"/><path d="m136 181 15 5" stroke="#ffd079" stroke-width="3" stroke-linecap="round"/>
<g class="float-card"><g transform="rotate(-12 158 86)"><rect x="79" y="37" width="158" height="90" rx="13" fill="#174a43" stroke="#e7ffdf"/><rect x="78" y="34" width="158" height="90" rx="13" fill="url(#plastic)" stroke="#fffcea" stroke-width="2"/><path d="M175 34q46 32 60 67M187 34q34 24 49 51M202 34q20 15 34 34" stroke="#f6fff0" opacity=".53" fill="none"/><rect x="90" y="47" width="23" height="17" rx="4" fill="#f0ca75" stroke="#99763e"/><path d="M94 54h15m-11-6v5m7 2v7" stroke="#99763e"/><text x="90" y="92" font-family="sans-serif" font-weight="bold" font-size="12" textLength="133" lengthAdjust="spacingAndGlyphs" fill="#154c42">KARTU MAHASISWA</text><text x="91" y="108" font-family="sans-serif" font-size="8" letter-spacing="1.1" fill="#275c4f">IDENTITAS  /  NFC</text><path d="M202 51q6 4 4 10m1-14q10 6 7 17m-3-21q13 8 10 23" fill="none" stroke="#245d50" stroke-width="2" stroke-linecap="round"/></g></g></svg>`;
function clearLocal(){id='';person=null;choices=[];pick=null;digits='';note='';issue='';pending=false;deadline=0;lastActivity=0;prior=''}
function go(next,text=''){epoch++;if(dialog.open)dialog.close();state=next;note=text;render();main.focus({preventScroll:true});window.scrollTo(0,0);if(next==='manual')$('#suffix').focus({preventScroll:true});if(next==='pair')$('#paircode').focus()}
function home(){clearLocal();go('scan')}
function scanStatus(){if(offline)return 'Koneksi terputus · hubungi panitia.';if(standalone||snap.status==='open')return 'Silakan tap kartu mahasiswa Anda.';return snap.status==='draft'?'Pemilihan belum dibuka.':snap.status==='closed'?'Pemilihan telah ditutup.':snap.status==='closing'?'Pemilihan sedang ditutup.':'Menunggu pemilihan.'}
function updateStatus(){const n=$('#scan-status');if(n){n.textContent=scanStatus();n.dataset.ready=standalone||!!(snap.paired&&snap.status==='open'&&!offline)}}
function panel(step,title,body,cl=''){return `<section class="panel motion ${cl}"><p class="eyebrow">${step}</p><h1>${title}</h1>${body}<div class="error" id="error" role="alert">${esc(note)}</div></section>`}
function render(){const e=snap;
 if(state==='scan'){const identity=e.identity||'HIMABISDI',period=(e.period||'2026/2027').replace(/(\d{4})\/(\d{4})/,'$1–$2');main.innerHTML=`<section class="scan motion"><p class="micro intro">Selamat datang di bilik suara</p><h1>${e.name&&e.name!=='Pemilihan ketua HIMABISDI'?esc(e.name):'Pemilihan Ketua Umum'}<span>${esc(identity)} ${esc(period)}</span></h1>${tapArt}${btn('demo','Tap kartu <span aria-hidden="true">↗</span>','tap','data-kind="valid"')}<div class="manual-path"><span>Tidak bawa kartu atau kartu error?</span>${btn('manual','Masukkan 4 digit NPM','mini plain')}</div><p id="scan-status" class="scan-state" role="status"></p></section>`;updateStatus();return}
 if(state==='manual'){main.innerHTML=panel('01 / Identifikasi manual','Lengkapi NPM Anda',`<p id="npm-help">Awalan <strong>${npmPrefix}</strong> sudah terisi. Ketik empat angka terakhir dengan keyboard.</p><div class="npm-line"><span class="npm-prefix" aria-hidden="true">${npmPrefix}</span><div class="digits-wrap"><div class="digits" aria-hidden="true">${'<span class="slot"></span>'.repeat(4)}</div><input id="suffix" aria-label="Empat digit terakhir NPM" aria-describedby="npm-help error" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="4" pattern="[0-9]{4}"></div></div><p class="hint">Identitas diperiksa otomatis setelah angka keempat.</p><div class="actions">${btn('back','Kembali ke tap kartu','mini plain')}</div>`,'manual');return}
 if(state==='identity'){main.innerHTML=panel('02 / Identitas','Apakah ini Anda?',`<div class="credential"><h2>${esc(person.name)}</h2><p>NPM ${esc(person.npm)}</p></div><div class="actions">${btn('wrong','Bukan saya','plain')}${btn('ready','Ya, ini saya','primary')}</div>`);return}
 if(state==='choose'){main.innerHTML=`<section class="ballot motion"><p class="eyebrow">03 / Surat suara · ${choices.length} kandidat</p><h1>Pilih calon ketua</h1><div class="cgrid" style="--n:${choices.length}">${choices.map(c=>`<article class="candidate"><header><img src="${esc(c.photo)}" alt="Potret ${esc(c.name)}"><span class="number" aria-label="Nomor ${esc(c.no)}">${esc(String(c.no).padStart(2,'0'))}</span></header><h2>${esc(c.name)}</h2><div><h3>Visi</h3><p>${esc(c.vision)}</p></div><div><h3>Misi</h3><p>${esc(c.mission)}</p></div>${btn('pick','Pilih '+esc(c.name.split(/\s+/)[0])+' →','pick primary',`data-id="${esc(c.id)}" aria-label="Pilih ${esc(c.name)}"`)}</article>`).join('')}</div><div class="actions">${btn('leave','Keluar dari sesi','plain mini')}</div><div id="error" role="alert"></div></section>`;return}
 if(state==='confirm'){main.innerHTML=panel('04 / Konfirmasi',`Apakah Anda yakin memilih ${esc(pick.name)}?`,`<img class="confirmphoto" src="${esc(pick.photo)}" alt=""><p>Nomor ${esc(pick.no)} · Suara yang sudah direkam tidak bisa diubah.</p><div class="actions">${btn('change','Ganti pilihan','plain')}${btn('send','Ya, rekam suara','primary')}</div>`);return}
 const back=btn('back','Kembali ke tap kartu','plain'),cfg={
  blocked:['Pemeriksaan identitas',issue==='voted'?'Sudah memilih':'Kartu belum dikenali',`<p>${esc(issueText[issue])}</p><div class="actions">${back}${issue==='voted'?'':btn('manual','Masukkan 4 digit NPM','primary')}</div>`],
  sending:['05 / Pencatatan','Merekam suara…','<p role="status">Tunggu konfirmasi dari dashboard.</p>'],
  uncertain:['Pemeriksaan kiriman','Status suara sedang diperiksa','<p>Jangan kirim suara lagi. Jika pesan ini tetap tampil, hubungi admin untuk memeriksa kiriman.</p>'],
  success:['05 / Selesai','Suara Anda sudah tercatat.','<p>Terima kasih. Bilik kembali ke layar tap dalam <b id="secs">5</b> detik.</p>'],
  idle:['Sesi tidak aktif','Masih ingin memilih?',`<p>Sesi berakhir dalam <b id="secs">15</b> detik.</p><div class="actions">${btn('extend','Ya, lanjutkan','primary')}</div>`],
  paused:['Status pemilihan','Pemilihan dijeda','<p>Tunggu arahan admin. Layar tap kembali saat pemilihan dilanjutkan.</p>'],
  message:['Bilik suara','Perlu bantuan admin?',`<div class="actions">${back}</div>`]
 };const v=cfg[state];main.innerHTML=panel(...v);
}
function showDialog(title,content){dialog.innerHTML=`<p class="eyebrow">Bilik suara</p><h2 id="dialog-title">${title}</h2>${content}<div class="actions">${btn('close','Tutup','mini plain')}</div>`;dialog.setAttribute('aria-labelledby','dialog-title');if(!dialog.open)dialog.showModal()}
function errorText(x){return x.message||String(x)}
function err(x){const msg=errorText(x);if($('#error')){$('#error').textContent=msg;audio('error')}else tell(msg,'error')}
async function task(fn){if(busy||reading)return;busy=true;epoch++;try{await fn()}catch(x){err(x)}finally{busy=false}}
function deny(key,extra=''){issue=key;go('blocked',extra);audio('error')}
async function matchVoter(by,value){
 const r=await rpc('scan',{by,value});
 if(r.issue){if(by==='suffix'&&['missing','ambiguous'].includes(r.issue)){digits='';paintDigits();$('#error').textContent=issueText[r.issue];const slots=$('.digits');slots.classList.remove('shake');void slots.offsetWidth;slots.classList.add('shake');audio('error');return}return deny(r.issue)}
 if(state==='manual')await depart();id=r.id;person={name:r.name,npm:r.npm};digits='';lastActivity=now();lastTouch=0;audio('verify');go('identity');
}
// Satu pintu masuk kartu. UID diperlakukan sebagai token kartu, bukan NPM.
async function onCardDetected(cardUid){
 if(publicView||state!=='scan'||reading)return;reading=true;epoch++;
 try{if(dialog.open)dialog.close();if(!cardUid)return deny('failed');await matchVoter('card',cardUid)}
 catch(x){go('message',errorText(x));audio('error')}finally{reading=false}
}
async function demo(kind){
 if(state!=='scan'||publicView)return;if(dialog.open)dialog.close();
 if(kind==='failed')return onCardDetected(null);
 try{const token=await rpc('cardSample',{kind});
  if(!token&&kind==='used')return deny('voted','Kartu sudah digunakan.');
  if(!token&&standalone)return go('message','Semua kartu sudah digunakan.');
  if(!token)return go('message','Tidak ada kartu yang tersedia. Hubungi admin untuk memeriksa daftar aktif.');
  await onCardDetected(token)
 }catch(x){go('message',errorText(x));audio('error')}
}
function paintDigits(){const input=$('#suffix');if(!input)return;if(input.value!==digits)input.value=digits;document.querySelectorAll('.slot').forEach((slot,i)=>{const next=digits[i]||'';if(slot.textContent===next)return;slot.textContent=next;slot.classList.remove('pop');if(next){void slot.offsetWidth;slot.classList.add('pop')}})}
async function setDigits(value,typed){const next=value.replace(/[^0-9]/g,'').slice(0,4);if(typed&&(next!==digits||/^\d$/.test(typed)))audio('click');digits=next;paintDigits();$('#error').textContent='';lastActivity=now();if(digits.length===4){const input=$('#suffix');input.readOnly=true;try{await matchVoter('suffix',digits)}catch(x){digits='';paintDigits();throw x}finally{input.readOnly=false}}}
async function depart(){if(reduceFX.matches)return;const p=$('.manual');if(!p)return;p.classList.add('depart');await new Promise(done=>setTimeout(done,140))}
function success(){if(state==='success')return;clearLocalExceptId();deadline=now()+5000;go('success');audio('success')}
function clearLocalExceptId(){const keep=id;clearLocal();id=keep}
async function act(op,b){
 if(op==='close')return dialog.close();if(op==='full')return fullscreen();if(op==='demo')return demo(b.dataset.kind);
 if(op==='manual'){digits='';lastActivity=now();return go('manual')}if(op==='back'){if(state==='manual')await depart();return home()}
 if(op==='leave')return showDialog('Keluar tanpa merekam suara?',`<p>Pilihan Anda tidak akan disimpan.</p><div class="actions">${btn('cancelSession','Ya, keluar')}</div>`);
 if(op==='wrong'||op==='cancelSession'){await rpc('cancelSelf',{id});return home()}
 if(op==='ready'){choices=await rpc('ready',{id});person=null;lastActivity=now();return go('choose')}
 if(op==='pick'){pick=choices.find(c=>c.id===b.dataset.id);return go('confirm')}if(op==='change')return go('choose');
 if(op==='extend'){await rpc('touch',{id});lastActivity=now();return go(prior)}
 if(op==='send'&&state==='confirm'&&!pending){if(!standalone&&!navigator.onLine)throw Error('Jaringan terputus. Suara belum dikirim; hubungi admin.');pending=true;go('sending');try{if(await rpc('vote',{id,candidate:pick.id})==='committed')return success();go('uncertain')}catch(x){go('uncertain',errorText(x))}}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-do]');if(b)task(()=>act(b.dataset.do,b))});
document.addEventListener('input',ev=>{if(ev.target.id==='suffix'){gesture=true;task(()=>setDigits(ev.target.value,ev.inputType.startsWith('delete')?'delete':ev.data||'input'))}});
for(const event of ['pointerdown','keydown','input','pointermove','scroll'])document.addEventListener(event,()=>{if(!id||!active())return;lastActivity=now();if(lastActivity-lastTouch>3000){lastTouch=lastActivity;rpc('touch',{id}).catch(()=>{})}},{passive:true});
function observe(s){
 const old=snap;snap=s;offline=false;
 if(s.phase==='committed'){id=s.sid;success();return}
 if(state==='success')return;
 if(s.phase==='uncertain'){id=s.sid;pending=true;if(state!=='uncertain')go('uncertain');return}
 if(id&&s.sid!==id){const expired=state==='idle'||active()&&now()-lastActivity>=105000;clearLocal();return expired?go('scan'):go('message','Sesi telah berakhir. Hubungi admin bila Anda belum mengetahui status suara.')}
 if(s.status==='paused'){if(state!=='paused'&&state!=='pair'){clearLocalExceptId();go('paused')}return}
 if(state==='paused'){home();return}
 if(state==='uncertain'&&s.phase==='ready'){pending=false;if(pick){lastActivity=now();go('confirm','Suara belum tercatat. Periksa pilihan sebelum mengirim kembali.')}else home();return}
 if(state==='scan'){if(old.name!==s.name||old.period!==s.period||old.identity!==s.identity)render();else updateStatus()}
}
async function poll(){
 if(polling||busy||reading||state==='sending')return;polling=true;const ver=epoch;
 try{const s=await rpc('booth');if(ver!==epoch||busy||reading)return;
  observe(s)
 }catch(x){if(ver!==epoch||busy||reading)return;offline=true;if(publicView){publicSig='';snap={};note=errorText(x);render()}else if(state==='scan')updateStatus();else if(active()){clearLocal();go('message',errorText(x))}}
 finally{polling=false}
}
function expire(){
 if(busy||reading||publicView)return;
 if(state==='manual'&&now()-lastActivity>=90000)return home();
 if(active()&&now()-lastActivity>=90000){prior=state;deadline=lastActivity+105000;go('idle');audio('note')}
 if(!['idle','success'].includes(state))return;const n=Math.max(0,Math.ceil((deadline-now())/1000));$('#secs').textContent=n;if(n)return;
 const old=id,done=state==='success';task(async()=>{try{await rpc(done?'release':'cancelSelf',{id:old})}catch{/* Otoritas juga melepas sesi kedaluwarsa; polling memeriksa commit. */}home()})
}
window.addEventListener('pageshow',ev=>{if(ev.persisted){if(standalone&&id&&!pending&&state!=='success')practice.run('cancelSelf',{id});home();poll()}});
render();poll();setInterval(poll,1000);setInterval(expire,250);
