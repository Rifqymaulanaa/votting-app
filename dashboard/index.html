const B=(op,text,cl='mini',id='')=>linkBtn(op,text,cl,idAttr(id));
function preparation(){const {e,candidates:c,stats:t}=model;return `<section><p class="eyebrow">01 / Identitas pemilihan</p><div class="between"><div><h2>${esc(e.name)}</h2><small>Periode ${esc(e.period)}</small></div>${B('event','Ubah')}</div></section><section><div class="between"><div><p class="eyebrow">02 / Surat suara</p><h2>Kandidat</h2></div>${B('add','Tambah kandidat',c.length>=4?'hidden mini':'mini')}</div><div class="tiles">${c.map(k=>`<article class="tile"><img class="portrait" src="${esc(k.photo)}" alt=""><small>Nomor ${esc(k.no)}</small><h3>${esc(k.name)}</h3><p><b>Visi</b><br>${esc(k.vision)}</p><p><b>Misi</b><br>${esc(k.mission)}</p>${B('edit','Edit','mini',k.id)} ${B('remove','Hapus','mini',k.id)}</article>`).join('')}</div></section><section><p class="eyebrow">03 / Hak suara</p><h2>Daftar pemilih</h2><p>Isi NPM sebagai teks, nama, dan status panitia (1 = panitia, 0 = mahasiswa). UID kartu boleh kosong. Unggahan menggantikan seluruh daftar setelah dikonfirmasi.</p>${B('template','Unduh template Excel')} ${B('upload','Unggah daftar')}<p>${fmt(t.all)} pemilih terdaftar · Panitia berbobot 3, mahasiswa berbobot 1.</p></section><section class="between"><strong>${c.length} kandidat · ${fmt(t.all)} pemilih valid</strong>${linkBtn('open','Buka pemilihan','primary',t.all&&c.length>=2?'':'disabled')}</section>`}
function live(){const t=model.stats,s=model.e.status;return `<section><p class="eyebrow">Partisipasi pemilih</p><h2>${fmt(t.voted)} dari ${fmt(t.all)} pemilih</h2><progress aria-label="Partisipasi" max="100" value="${t.pct}"></progress><p>${fmt(t.pct)}% sudah memilih</p></section><section class="row">${s==='closing'?'<p>Menunggu penyelesaian sesi aktif, maksimal dua menit.</p>':B(s==='paused'?'open':'paused',s==='paused'?'Lanjutkan':'Jeda')+B('closing','Tutup pemilihan','primary')}</section>`}
function finalReport(){return `<section><p class="eyebrow">Hasil terverifikasi</p>${results(model.result)}</section><section>${B('export','Unduh rekap Excel','primary')}</section>`}
function paint(){const s=model.e.status,k=s==='draft'?0:s==='closed'?2:1;app.innerHTML=`<main class="workspace sheet"><header class="between"><div><p class="eyebrow">HIMABISDI · Administrasi</p><h1>${['Persiapan','Pemilihan berlangsung','Hasil pemilihan'][k]}</h1></div>${B('logout','Keluar')}</header><ol class="stages">${['Persiapan','Berlangsung','Hasil'].map((v,i)=>`<li ${i===k?'aria-current="step"':''}>${v}</li>`).join('')}</ol><div class="flow">${k===0?preparation():`<p class="eyebrow">${esc(model.e.name)} · ${esc(model.e.period)} · ${esc(stat[s])}</p>`+(k===1?live():finalReport())}</div></main>`}
async function sync(force=true){const next=await rpc('view');const changed=!model||next.e.status!==model.e.status||next.stats.voted!==model.stats.voted;model=next;if(force||changed)paint()}
async function action(op,id){if(op==='dismiss')return dismiss();if(op==='logout'){await rpc('logout');sessionKey='';model=null;return loginPage()}if(op==='event')return modal('Identitas pemilihan',form('config',field('name','Nama pemilihan',model.e.name,'required maxlength="100"')+field('period','Periode',model.e.period,'required maxlength="36"')));if(op==='edit'||op==='add')return candForm(id);if(op==='template')return xlsx([['npm','nama','is_panitia','rfid_uid'],['023120001','Nadia Putra Permana',1,'K-1'],['023120002','Farhan Dwi Anindita',0,'K-2']],'template-pemilih');if(op==='upload')return modal('Unggah daftar pemilih',form('preview',label('File Excel (.xlsx)','<input name="file" type="file" accept=".xlsx" required>'),'Periksa daftar'));if(op==='import'){await rpc(op,{token:preview.token});preview=null;dismiss()}else if(op==='remove'){if(!await confirmAction('Hapus kandidat ini?'))return;await rpc('candidate',{id,remove:true})}else if(['open','paused','closing'].includes(op)){if(!await confirmAction(op==='closing'?'Tutup pemilihan? Setelah sesi aktif selesai, suara dan bobot akan diverifikasi.':op==='paused'?'Jeda pemilihan?':'Buka pemilihan dengan daftar ini?'))return;await rpc('control',{next:op})}else if(op==='export'){return xlsx(await rpc('export',{type:'result'}),'rekap-pemilihan')}await sync()}
async function submit(k,d){if(k==='login'){sessionKey=(await rpc(k,d)).token}else if(k==='preview'){const rows=await readSheet(d.file);preview=await rpc('preview',{rows});modal('Periksa daftar',preview.errors.length?`<p class="error">${preview.errors.map(esc).join('<br>')}</p>`:`<p>${preview.items.length} pemilih valid. Daftar ini akan menggantikan daftar sebelumnya.</p>${B('import','Gunakan daftar ini','primary')}`);return}else if(k==='config')await rpc(k,{...d,desc:d.name,identity:'HIMABISDI'});else if(k==='candidate'){d.photo=await photoData(d.photo);await rpc(k,d)}dismiss();await sync()}
loginPage();navigator.locks.request('himabisdi-election-admin',{ifAvailable:true},async lock=>{if(!lock){app.innerHTML='<main class="login-sheet"><h2>Ruang admin sedang dibuka di tab lain.</h2><p>Gunakan tab tersebut untuk melanjutkan.</p></main>';return}hostReady=seed();await hostReady;isHost=true;setInterval(()=>{if(sessionKey&&!locked&&!dlg.open&&model?.e.status!=='draft')sync(false).catch(x=>tell(x.message,'error'))},1000);await new Promise(()=>{})});
</script></body></html>
